<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1117" />
  <title>男友拍照助手</title>
  <style>
    :root{--ink:#f8fbff;--muted:rgba(248,251,255,.68);--glass:rgba(12,18,24,.58);--line:rgba(255,255,255,.14);--good:#92e0b2;--warn:#ffd38a;--hot:#ff9aa8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1117;color:var(--ink);font-family:"Noto Sans SC","PingFang SC",sans-serif}button,input{font:inherit;color:inherit}button{border:0;cursor:pointer}
    .app{min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#27343d 0,#0b1117 52%);padding:18px}
    .phone{position:relative;width:min(100%,430px);height:min(920px,calc(100dvh - 36px));min-height:720px;border-radius:36px;overflow:hidden;background:#151d22;box-shadow:0 24px 80px rgba(0,0,0,.38)}
    .camera{position:absolute;inset:0}.demo,.video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.demo{opacity:1;transition:opacity .2s}.video{opacity:0;transition:opacity .2s}.live .demo{opacity:0}.live .video{opacity:1}.video.mirror{transform:scaleX(-1)}
    .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.05) 28%,rgba(0,0,0,.1) 54%,rgba(0,0,0,.72));pointer-events:none}
    .topbar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 16px) 18px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:5}
    .brand small,.status small{display:block;color:var(--muted);font-size:12px}.brand strong{display:block;font-size:20px;line-height:1.15}.status{display:grid;gap:8px;justify-items:end}.pill{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.13);backdrop-filter:blur(18px);border:1px solid var(--line);font-size:12px}.dot{width:7px;height:7px;border-radius:999px;background:var(--good);box-shadow:0 0 0 5px rgba(146,224,178,.16)}
    .guide{position:absolute;inset:116px 24px 230px;z-index:2;pointer-events:none}.thirds span{position:absolute;background:rgba(255,255,255,.18)}.thirds span:nth-child(1),.thirds span:nth-child(2){left:0;right:0;height:1px}.thirds span:nth-child(1){top:33.33%}.thirds span:nth-child(2){top:66.66%}.thirds span:nth-child(3),.thirds span:nth-child(4){top:0;bottom:0;width:1px}.thirds span:nth-child(3){left:33.33%}.thirds span:nth-child(4){left:66.66%}
    .target{position:absolute;left:var(--x);top:var(--y);width:var(--w);aspect-ratio:.75;transform:translate(-50%,-50%) scale(var(--s)) rotate(var(--tilt));border:2px solid rgba(255,255,255,.78);border-radius:28px;box-shadow:0 0 0 999px rgba(0,0,0,.08)}.target:before,.target:after{content:"";position:absolute;width:26px;height:26px;border-color:#fff}.target:before{left:-2px;top:-2px;border-left:4px solid;border-top:4px solid;border-radius:26px 0 0}.target:after{right:-2px;bottom:-2px;border-right:4px solid;border-bottom:4px solid;border-radius:0 0 26px}.face-line{position:absolute;left:18%;right:18%;top:28%;height:1px;border-top:1px dashed rgba(255,255,255,.42)}
    .coach{position:absolute;left:16px;right:16px;bottom:176px;z-index:6;display:grid;gap:10px}.coach-main{padding:14px 15px;border-radius:22px;background:rgba(10,16,21,.68);border:1px solid var(--line);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-between;gap:12px}.coach-main strong{font-size:19px;line-height:1.25}.coach-main span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.score{width:54px;height:54px;border-radius:18px;background:#fff;color:#15212a;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips button{white-space:nowrap;min-height:38px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:13px}.chips button.active{background:#fff;color:#101820}
    .drawer{position:absolute;left:0;right:0;bottom:0;z-index:7;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);border-radius:28px 28px 0 0;background:rgba(9,14,19,.82);border-top:1px solid var(--line);backdrop-filter:blur(24px)}.modes{display:flex;gap:9px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.modes::-webkit-scrollbar{display:none}.mode{min-width:106px;min-height:54px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid var(--line);display:grid;place-items:center;padding:6px 10px}.mode strong{font-size:13px}.mode small{color:var(--muted);font-size:11px}.mode.active{background:#fff;color:#111b22}.mode.active small{color:#59636b}
    .controls{display:grid;grid-template-columns:54px 1fr 54px;align-items:center;gap:16px}.iconbtn{width:54px;height:54px;border-radius:20px;background:rgba(255,255,255,.12);border:1px solid var(--line)}.shutter{width:76px;height:76px;border-radius:999px;background:#fff;margin:auto;position:relative;box-shadow:0 0 0 7px rgba(255,255,255,.18)}.shutter:after{content:"";position:absolute;inset:14px;border-radius:999px;background:#ff7f8f}.shutter.ready:after{background:var(--good)}.subtools{margin-top:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.subtools button{min-height:38px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:12px}
    .sheet{position:absolute;left:16px;right:16px;bottom:160px;z-index:8;border-radius:24px;background:rgba(249,251,255,.96);color:#111b22;padding:16px;box-shadow:0 16px 60px rgba(0,0,0,.28);display:none}.sheet.open{display:block}.sheet h3{margin:0 0 10px}.sheet ul{margin:0;padding-left:20px;color:#4a5660;line-height:1.8;font-size:14px}.sheet button{margin-top:14px;width:100%;min-height:44px;border-radius:14px;background:#111b22;color:#fff}
    .toast{position:absolute;left:18px;right:18px;top:92px;z-index:20;min-height:44px;border-radius:16px;background:rgba(255,255,255,.92);color:#111b22;display:none;place-items:center;font-weight:700}.toast.show{display:grid}.flash{position:absolute;inset:0;background:#fff;z-index:30;animation:flash .22s both}@keyframes flash{from{opacity:0}35%{opacity:1}to{opacity:0}}
    @media (min-width:760px){.phone{width:min(100%,1180px);height:min(860px,calc(100dvh - 36px));display:grid;grid-template-columns:minmax(0,1fr) 360px}.camera{right:360px}.drawer{left:auto;top:0;width:360px;border-radius:0;background:rgba(9,14,19,.86);display:flex;flex-direction:column;justify-content:flex-end}.coach{right:376px}.sheet{right:376px}.guide{right:384px}}
    @media (max-width:430px){.app{padding:0}.phone{width:100%;height:100dvh;min-height:100dvh;border-radius:0}.guide{inset:112px 18px 224px}.coach{left:12px;right:12px;bottom:172px}.drawer{padding-inline:12px}.brand strong{font-size:18px}.coach-main strong{font-size:17px}.subtools{gap:6px}.subtools button{font-size:11px}}
  </style>
</head>
<body>
<main class="app">
  <section class="phone">
    <div class="camera" id="camera">
      <svg class="demo" viewBox="0 0 720 1280" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9d5c0"/><stop offset=".58" stop-color="#cad9dc"/><stop offset="1" stop-color="#607680"/></linearGradient>
          <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
        </defs>
        <rect width="720" height="1280" fill="url(#sunset)"/>
        <circle cx="560" cy="190" r="118" fill="#fff" opacity=".33" filter="url(#blur)"/>
        <path d="M-20 820 C140 730 270 740 390 820 C500 890 620 900 740 810 L740 1280 L-20 1280Z" fill="#5f7b7f"/>
        <g id="people" transform="translate(360 760) scale(1)">
          <g class="person" transform="translate(-86 0)">
            <ellipse cx="0" cy="172" rx="55" ry="11" fill="#000" opacity=".16"/><circle cx="0" cy="0" r="32" fill="#8f6658"/><path d="M-30 24 C-44 74 -26 126 -16 172 L18 172 C30 126 44 74 30 24Z" fill="#23384f"/><path d="M-52 64 C-62 98 -38 124 -18 116" stroke="#fff1df" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M52 64 C62 98 38 124 18 116" stroke="#fff1df" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M-18 172 L-32 234 M18 172 L32 234" stroke="#23384f" stroke-width="13" stroke-linecap="round"/>
          </g>
          <g class="person" transform="translate(86 0)">
            <ellipse cx="0" cy="172" rx="55" ry="11" fill="#000" opacity=".16"/><circle cx="0" cy="0" r="32" fill="#6f5963"/><path d="M-30 24 C-44 74 -26 126 -16 172 L18 172 C30 126 44 74 30 24Z" fill="#465e6e"/><path d="M-52 64 C-62 98 -38 124 -18 116" stroke="#fff1df" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M52 64 C62 98 38 124 18 116" stroke="#fff1df" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M-18 172 L-32 234 M18 172 L32 234" stroke="#465e6e" stroke-width="13" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
      <video class="video" id="video" autoplay playsinline muted></video>
      <div class="shade"></div>
      <div class="topbar">
        <div class="brand"><small>AI 导拍模式</small><strong>男友拍照助手</strong></div>
        <div class="status"><span class="pill"><i class="dot"></i><span id="camStatus">演示场景</span></span><small id="quality">构图 91 / 姿势 88</small></div>
      </div>
      <div class="guide" id="guide">
        <div class="thirds" id="thirds"><span></span><span></span><span></span><span></span></div>
        <div class="target" id="target" style="--x:50%;--y:50%;--w:58%;--s:1;--tilt:0deg"><div class="face-line"></div></div>
      </div>
      <div class="coach">
        <div class="coach-main">
          <div><strong id="hint">画面稳定，可以拍</strong><span id="detail">眼睛贴近上三分线，人物留白刚好。</span></div>
          <div class="score" id="score">91</div>
        </div>
        <div class="chips" id="tips"></div>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <aside class="drawer">
      <div class="modes" id="modes"></div>
      <div class="controls">
        <button class="iconbtn" id="cameraBtn" aria-label="开启摄像头">📷</button>
        <button class="shutter" id="shutter" aria-label="拍摄"></button>
        <button class="iconbtn" id="switchBtn" aria-label="切换镜头">↻</button>
      </div>
      <div class="subtools">
        <button id="voiceBtn">语音开</button>
        <button id="autoBtn">自动拍</button>
        <button id="gridBtn">网格开</button>
        <button id="poseBtn">姿势卡</button>
      </div>
    </aside>

    <section class="sheet" id="poseSheet">
      <h3 id="poseTitle">情侣合照姿势</h3>
      <ul id="poseList"></ul>
      <button id="closeSheet">知道了</button>
    </section>
  </section>
</main>

<script>
const modes={
  couple:{name:'情侣合照',sub:'两人同框',x:0,y:.02,w:60,s:1,tilt:0,score:91,pose:['两个人肩膀靠近一点','女生身体微微侧向镜头','男生手机略微压低，避免俯拍'],hints:['两人靠近','手机放低','保留头顶']},
  portrait:{name:'半身人像',sub:'头肩好看',x:.02,y:-.05,w:54,s:.95,tilt:0,score:89,pose:['眼睛放在上三分线','下巴微收，肩膀放松','镜头离脸不要太近'],hints:['抬头一点','肩膀放松','脸在上三分线']},
  travel:{name:'全身旅拍',sub:'腿不截断',x:-.03,y:.07,w:50,s:.86,tilt:0,score:88,pose:['手机放到腰部高度','脚边留一点地面','人物放在画面中线附近'],hints:['手机放低','脚别切掉','后退一步']},
  sample:{name:'照图复刻',sub:'叠图参考',x:0,y:0,w:56,s:1.04,tilt:-2,score:86,pose:['先对齐人物头顶','再对齐肩膀和脚边','最后微调背景线条'],hints:['对齐头顶','参考肩线','背景扶正']}
};
const state={mode:'couple',camera:false,stream:null,facing:'environment',voice:true,auto:false,grid:true,counting:0,shot:false,lastHint:''};
const $=id=>document.getElementById(id);
const camera=$('camera'),video=$('video'),target=$('target'),people=$('people'),tips=$('tips'),modesEl=$('modes'),toast=$('toast');
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
function speak(text){if(!state.voice||!('speechSynthesis'in window)||state.lastHint===text)return;state.lastHint=text;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=1.02;speechSynthesis.speak(u)}
function stopCamera(){state.stream?.getTracks().forEach(t=>t.stop());state.stream=null;video.srcObject=null;state.camera=false;camera.classList.remove('live')}
async function openCamera(facing=state.facing){if(!navigator.mediaDevices?.getUserMedia){showToast('浏览器不支持摄像头');return false}try{stopCamera();const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:1280},height:{ideal:1920}}});state.stream=stream;state.camera=true;state.facing=facing;video.srcObject=stream;video.classList.toggle('mirror',facing==='user');await video.play().catch(()=>{});camera.classList.add('live');showToast(facing==='user'?'已切到前置镜头':'摄像头已开启');render();return true}catch(e){showToast('请允许摄像头权限');render();return false}}
function current(){return modes[state.mode]}
function calc(){const m=current();const drift=Math.abs(m.x)*90+Math.abs(m.y)*70+Math.abs(m.tilt)*2+(m.w<53?4:0);const score=Math.max(72,Math.round(m.score-drift));const stable=score>=88;let hint=stable?'画面稳定，可以拍':'再微调一下';let detail=m.pose[0];if(Math.abs(m.tilt)>1.5){hint=m.tilt>0?'逆时针扶正':'顺时针扶正';detail='背景线条有点斜'}else if(m.w<53){hint='后退一步';detail='给腿和背景多留一点空间'}else if(Math.abs(m.x)>.025){hint=m.x>0?'手机向右一点':'手机向左一点';detail='人物稍微偏出黄金区域'}return{score,stable,hint,detail}}
function renderModes(){modesEl.innerHTML='';Object.entries(modes).forEach(([id,m])=>{const b=document.createElement('button');b.className=`mode${id===state.mode?' active':''}`;b.innerHTML=`<strong>${m.name}</strong><small>${m.sub}</small>`;b.onclick=()=>{state.mode=id;showToast(`切换到${m.name}`);render();};modesEl.appendChild(b)})}
function renderTips(){tips.innerHTML='';current().hints.forEach((t,i)=>{const b=document.createElement('button');b.className=i===0?'active':'';b.textContent=t;b.onclick=()=>{showToast(t);speak(t)};tips.appendChild(b)})}
function render(){const m=current(),a=calc();target.style.setProperty('--x',`${50+m.x*100}%`);target.style.setProperty('--y',`${50+m.y*100}%`);target.style.setProperty('--w',`${m.w}%`);target.style.setProperty('--s',m.s);target.style.setProperty('--tilt',`${m.tilt}deg`);people.setAttribute('transform',`translate(${360+m.x*180} ${760+m.y*160}) scale(${m.s}) rotate(${m.tilt})`);$('hint').textContent=state.counting?`${state.counting}`:a.hint;$('detail').textContent=a.detail;$('score').textContent=a.score;$('quality').textContent=`构图 ${a.score} / 姿势 ${Math.max(80,a.score-3)}`;$('camStatus').textContent=state.camera?'实时取景':'演示场景';$('shutter').classList.toggle('ready',a.stable);$('voiceBtn').textContent=state.voice?'语音开':'语音关';$('autoBtn').textContent=state.auto?'自动开':'自动拍';$('gridBtn').textContent=state.grid?'网格开':'网格关';$('thirds').style.display=state.grid?'block':'none';renderModes();renderTips();if(state.auto&&a.stable&&!state.counting&&!window.autoTimer){window.autoTimer=setTimeout(()=>{window.autoTimer=null;startCountdown()},1200)}}
function flash(){const div=document.createElement('div');div.className='flash';camera.appendChild(div);setTimeout(()=>div.remove(),260)}
function shoot(){flash();showToast('已抓拍，可继续调整');speak('已拍下')}
function tick(){if(!state.counting)return;if(state.counting===1){state.counting=0;shoot();render();return}state.counting-=1;speak(String(state.counting));render();setTimeout(tick,1000)}
function startCountdown(){if(state.counting)return;state.counting=3;speak('开始倒计时');render();setTimeout(tick,1000)}
$('cameraBtn').onclick=()=>state.camera?stopCamera()||render():openCamera(state.facing);
$('switchBtn').onclick=()=>openCamera(state.facing==='environment'?'user':'environment');
$('shutter').onclick=()=>state.camera?startCountdown():openCamera(state.facing);
$('voiceBtn').onclick=()=>{state.voice=!state.voice;if(!state.voice&&'speechSynthesis'in window)speechSynthesis.cancel();showToast(state.voice?'语音提示已开':'语音提示已关');render()};
$('autoBtn').onclick=()=>{state.auto=!state.auto;showToast(state.auto?'稳定后自动拍':'自动拍已关');render()};
$('gridBtn').onclick=()=>{state.grid=!state.grid;render()};
$('poseBtn').onclick=()=>{const m=current();$('poseTitle').textContent=`${m.name}姿势`;$('poseList').innerHTML=m.pose.map(x=>`<li>${x}</li>`).join('');$('poseSheet').classList.add('open')};
$('closeSheet').onclick=()=>$('poseSheet').classList.remove('open');
window.addEventListener('beforeunload',()=>{stopCamera();if('speechSynthesis'in window)speechSynthesis.cancel()});
render();
</script>
</body>
</html>
