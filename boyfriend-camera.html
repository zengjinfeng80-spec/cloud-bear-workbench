<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1117" />
  <title>男友拍照助手</title>
  <style>
    :root{--ink:#f8fbff;--muted:rgba(248,251,255,.68);--glass:rgba(12,18,24,.58);--line:rgba(255,255,255,.14);--good:#92e0b2;--warn:#ffd38a;--hot:#ff9aa8}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1117;color:var(--ink);font-family:"Noto Sans SC","PingFang SC",sans-serif}button,input{font:inherit;color:inherit}button{border:0;cursor:pointer}
    .app{min-height:100dvh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,#27343d 0,#0b1117 52%);padding:18px}
    .phone{position:relative;width:min(100%,430px);height:min(920px,calc(100dvh - 36px));min-height:720px;border-radius:36px;overflow:hidden;background:#151d22;box-shadow:0 24px 80px rgba(0,0,0,.38)}
    .camera{position:absolute;inset:0}.demo,.video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.demo{opacity:1;transition:opacity .2s}.video{opacity:0;transition:opacity .2s}.live .demo{opacity:0}.live .video{opacity:1}.video.mirror{transform:scaleX(-1)}
    .reference,.overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.reference{display:none;object-fit:cover;opacity:var(--ref-opacity,.48);mix-blend-mode:screen;filter:saturate(1.04) contrast(1.05);z-index:1}.has-reference .reference{display:block}.overlay{z-index:5}
    .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.05) 28%,rgba(0,0,0,.1) 54%,rgba(0,0,0,.72));pointer-events:none;z-index:4}
    .topbar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 16px) 18px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;z-index:8}
    .brand small,.status small{display:block;color:var(--muted);font-size:12px}.brand strong{display:block;font-size:20px;line-height:1.15}.status{display:grid;gap:8px;justify-items:end}.pill{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 11px;border-radius:999px;background:rgba(255,255,255,.13);backdrop-filter:blur(18px);border:1px solid var(--line);font-size:12px}.dot{width:7px;height:7px;border-radius:999px;background:var(--good);box-shadow:0 0 0 5px rgba(146,224,178,.16)}
    .guide{position:absolute;inset:116px 24px 230px;z-index:6;pointer-events:none}.thirds span{position:absolute;background:rgba(255,255,255,.18)}.thirds span:nth-child(1),.thirds span:nth-child(2){left:0;right:0;height:1px}.thirds span:nth-child(1){top:33.33%}.thirds span:nth-child(2){top:66.66%}.thirds span:nth-child(3),.thirds span:nth-child(4){top:0;bottom:0;width:1px}.thirds span:nth-child(3){left:33.33%}.thirds span:nth-child(4){left:66.66%}
    .target{position:absolute;left:var(--x);top:var(--y);width:var(--w);aspect-ratio:.75;transform:translate(-50%,-50%) scale(var(--s)) rotate(var(--tilt));border:2px solid rgba(255,255,255,.78);border-radius:28px;box-shadow:0 0 0 999px rgba(0,0,0,.08)}.target:before,.target:after{content:"";position:absolute;width:26px;height:26px;border-color:#fff}.target:before{left:-2px;top:-2px;border-left:4px solid;border-top:4px solid;border-radius:26px 0 0}.target:after{right:-2px;bottom:-2px;border-right:4px solid;border-bottom:4px solid;border-radius:0 0 26px}.face-line{position:absolute;left:18%;right:18%;top:28%;height:1px;border-top:1px dashed rgba(255,255,255,.42)}
    .coach{position:absolute;left:16px;right:16px;bottom:220px;z-index:6;display:grid;gap:10px}.coach-main{padding:14px 15px;border-radius:22px;background:rgba(10,16,21,.68);border:1px solid var(--line);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-between;gap:12px}.coach-main strong{font-size:19px;line-height:1.25}.coach-main span{display:block;margin-top:4px;color:var(--muted);font-size:12px}.score{width:54px;height:54px;border-radius:18px;background:#fff;color:#15212a;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chips button{white-space:nowrap;min-height:38px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:13px}.chips button.active{background:#fff;color:#101820}
    .drawer{position:absolute;left:0;right:0;bottom:0;z-index:7;padding:12px 14px calc(env(safe-area-inset-bottom) + 14px);border-radius:28px 28px 0 0;background:rgba(9,14,19,.82);border-top:1px solid var(--line);backdrop-filter:blur(24px)}.modes{display:flex;gap:9px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.modes::-webkit-scrollbar{display:none}.mode{min-width:106px;min-height:54px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid var(--line);display:grid;place-items:center;padding:6px 10px}.mode strong{font-size:13px}.mode small{color:var(--muted);font-size:11px}.mode.active{background:#fff;color:#111b22}.mode.active small{color:#59636b}
    .controls{display:grid;grid-template-columns:50px 1fr 50px;align-items:center;gap:12px}.iconbtn{width:50px;height:50px;border-radius:18px;background:rgba(255,255,255,.12);border:1px solid var(--line)}.shutter{width:72px;height:72px;border-radius:999px;background:#fff;margin:auto;position:relative;box-shadow:0 0 0 6px rgba(255,255,255,.18)}.shutter:after{content:"";position:absolute;inset:13px;border-radius:999px;background:#ff7f8f}.shutter.ready:after{background:var(--good)}.subtools{margin-top:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.subtools button{min-height:34px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:11px;padding:0 8px}.subtools button.active{background:#fff;color:#101820}
    .reference-tools{display:none;margin-top:9px;grid-template-columns:1fr auto;gap:8px;align-items:center}.reference-tools.show{display:grid}.reference-tools label{display:grid;gap:4px;color:var(--muted);font-size:11px}.reference-tools input{width:100%;accent-color:#fff}.reference-tools button{min-height:34px;border-radius:13px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-size:12px}.subtools button#saveBtn{background:#fff;color:#101820;font-weight:800}
    .sheet{position:absolute;left:16px;right:16px;bottom:160px;z-index:8;border-radius:24px;background:rgba(249,251,255,.96);color:#111b22;padding:16px;box-shadow:0 16px 60px rgba(0,0,0,.28);display:none}.sheet.open{display:block}.sheet h3{margin:0 0 10px}.sheet ul{margin:0;padding-left:20px;color:#4a5660;line-height:1.8;font-size:14px}.sheet button{margin-top:14px;width:100%;min-height:44px;border-radius:14px;background:#111b22;color:#fff}
    .save-sheet{position:absolute;inset:0;z-index:40;background:rgba(4,7,10,.82);display:none;place-items:end center;padding:14px}.save-sheet.open{display:grid}.save-card{width:min(100%,360px);max-height:86dvh;overflow:auto;border-radius:22px;background:#f8fbff;color:#101820;padding:12px;box-shadow:0 20px 80px rgba(0,0,0,.45)}.save-card img{display:block;width:100%;border-radius:16px;background:#111}.save-card h3{margin:10px 2px 4px;font-size:17px}.save-card p{margin:0 2px 10px;color:#53606a;font-size:12px;line-height:1.5}.save-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save-actions a,.save-actions button{display:grid;place-items:center;min-height:42px;border-radius:12px;text-decoration:none;background:#111b22;color:#fff;font-weight:700;font-size:13px}.save-actions button{background:#e7edf3;color:#101820}
    .toast{position:absolute;left:18px;right:18px;top:92px;z-index:20;min-height:44px;border-radius:16px;background:rgba(255,255,255,.92);color:#111b22;display:none;place-items:center;font-weight:700}.toast.show{display:grid}.flash{position:absolute;inset:0;background:#fff;z-index:30;animation:flash .22s both}@keyframes flash{from{opacity:0}35%{opacity:1}to{opacity:0}}
    @media (min-width:760px){.phone{width:min(100%,1180px);height:min(860px,calc(100dvh - 36px));display:grid;grid-template-columns:minmax(0,1fr) 360px}.camera{right:360px}.drawer{left:auto;top:0;width:360px;border-radius:0;background:rgba(9,14,19,.86);display:flex;flex-direction:column;justify-content:flex-end}.coach{right:376px}.sheet{right:376px}.guide{right:384px}}
    @media (max-width:430px){.app{padding:0}.phone{width:100%;height:100dvh;min-height:100dvh;border-radius:0}.guide{inset:104px 16px 248px}.coach{left:10px;right:10px;bottom:190px}.drawer{padding:10px 10px calc(env(safe-area-inset-bottom) + 10px)}.brand strong{font-size:18px}.coach-main strong{font-size:16px}.subtools{gap:5px}.subtools button{font-size:10px}.save-sheet{padding:10px}.save-card{width:min(100%,340px)}}
  </style>
</head>
<body>
<main class="app">
  <section class="phone">
    <div class="camera" id="camera">
      <svg class="demo" viewBox="0 0 720 1280" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9d5c0"/><stop offset=".58" stop-color="#cad9dc"/><stop offset="1" stop-color="#607680"/></linearGradient>
          <filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
        </defs>
        <rect width="720" height="1280" fill="url(#sunset)"/>
        <circle cx="560" cy="190" r="118" fill="#fff" opacity=".33" filter="url(#blur)"/>
        <path d="M-20 820 C140 730 270 740 390 820 C500 890 620 900 740 810 L740 1280 L-20 1280Z" fill="#5f7b7f"/>
        <g id="people" transform="translate(360 760) scale(1)">
          <g class="person" transform="translate(-86 0)">
            <ellipse cx="0" cy="172" rx="55" ry="11" fill="#000" opacity=".16"/><circle cx="0" cy="0" r="32" fill="#8f6658"/><path d="M-30 24 C-44 74 -26 126 -16 172 L18 172 C30 126 44 74 30 24Z" fill="#23384f"/><path d="M-52 64 C-62 98 -38 124 -18 116" stroke="#fff1df" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M52 64 C62 98 38 124 18 116" stroke="#fff1df" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M-18 172 L-32 234 M18 172 L32 234" stroke="#23384f" stroke-width="13" stroke-linecap="round"/>
          </g>
          <g class="person" transform="translate(86 0)">
            <ellipse cx="0" cy="172" rx="55" ry="11" fill="#000" opacity=".16"/><circle cx="0" cy="0" r="32" fill="#6f5963"/><path d="M-30 24 C-44 74 -26 126 -16 172 L18 172 C30 126 44 74 30 24Z" fill="#465e6e"/><path d="M-52 64 C-62 98 -38 124 -18 116" stroke="#fff1df" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M52 64 C62 98 38 124 18 116" stroke="#fff1df" stroke-width="12" fill="none" stroke-linecap="round"/><path d="M-18 172 L-32 234 M18 172 L32 234" stroke="#465e6e" stroke-width="13" stroke-linecap="round"/>
          </g>
        </g>
      </svg>
      <video class="video" id="video" autoplay playsinline muted></video>
      <img class="reference" id="reference" alt="参考图透明叠加" />
      <canvas class="overlay" id="overlay" aria-hidden="true"></canvas>
      <div class="shade"></div>
      <div class="topbar">
        <div class="brand"><small>AI 导拍模式</small><strong>男友拍照助手</strong></div>
        <div class="status"><span class="pill"><i class="dot"></i><span id="camStatus">演示场景</span></span><small id="quality">构图 91 / 姿势 88</small></div>
      </div>
      <div class="guide" id="guide">
        <div class="thirds" id="thirds"><span></span><span></span><span></span><span></span></div>
        <div class="target" id="target" style="--x:50%;--y:50%;--w:58%;--s:1;--tilt:0deg"><div class="face-line"></div></div>
      </div>
      <div class="coach">
        <div class="coach-main">
          <div><strong id="hint">画面稳定，可以拍</strong><span id="detail">眼睛贴近上三分线，人物留白刚好。</span></div>
          <div class="score" id="score">91</div>
        </div>
        <div class="chips" id="tips"></div>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <aside class="drawer">
      <div class="modes" id="modes"></div>
      <div class="controls">
        <button class="iconbtn" id="cameraBtn" aria-label="开启摄像头">📷</button>
        <button class="shutter" id="shutter" aria-label="拍摄"></button>
        <button class="iconbtn" id="switchBtn" aria-label="切换镜头">↻</button>
      </div>
      <div class="subtools">
        <button id="voiceBtn">语音开</button>
        <button id="autoBtn">自动拍</button>
        <button id="refBtn">参考图/上传</button>
        <button id="saveBtn">保存</button>
      </div>
      <div class="reference-tools" id="referenceTools">
        <input id="refInput" type="file" accept="image/*" hidden />
        <label>参考图透明度 <input id="refOpacity" type="range" min="15" max="85" value="48" /></label>
        <button id="clearRefBtn">清除</button>
      </div>
      <div class="subtools">
        <button id="gridBtn">网格开</button>
        <button id="poseBtn">姿势卡</button>
        <button id="detectBtn">AI识别</button>
        <button id="flipGuideBtn">叠框保存</button>
      </div>
    </aside>

    <section class="sheet" id="poseSheet">
      <h3 id="poseTitle">情侣合照姿势</h3>
      <ul id="poseList"></ul>
      <button id="closeSheet">知道了</button>
    </section>
    <section class="save-sheet" id="saveSheet" aria-label="保存照片预览">
      <div class="save-card">
        <img id="savePreview" alt="刚生成的照片" />
        <h3>照片已生成</h3>
        <p>iPhone 上如果没有自动进相册，长按上面的图片，选择“存储到照片”。也可以点“下载文件”保存到 Safari 下载。</p>
        <div class="save-actions">
          <a id="downloadLink" download="boyfriend-camera.jpg">下载文件</a>
          <button id="closeSaveSheet">继续拍</button>
        </div>
      </div>
    </section>
  </section>
</main>

<script>
const MEDIA_PIPE_FACE_MODEL='https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task';
const MEDIA_PIPE_POSE_MODEL='https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task';
const MEDIA_PIPE_WASM='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm';
const modes={
  couple:{name:'情侣合照',sub:'两人同框',x:0,y:.02,w:60,s:1,tilt:0,score:91,pose:['两个人肩膀靠近一点','女生身体微微侧向镜头','男生手机略微压低，避免俯拍'],hints:['两人靠近','手机放低','保留头顶']},
  portrait:{name:'半身人像',sub:'头肩好看',x:.02,y:-.05,w:54,s:.95,tilt:0,score:89,pose:['眼睛放在上三分线','下巴微收，肩膀放松','镜头离脸不要太近'],hints:['抬头一点','肩膀放松','脸在上三分线']},
  travel:{name:'全身旅拍',sub:'腿不截断',x:-.03,y:.07,w:50,s:.86,tilt:0,score:88,pose:['手机放到腰部高度','脚边留一点地面','人物放在画面中线附近'],hints:['手机放低','脚别切掉','后退一步']},
  sample:{name:'照图复刻',sub:'叠图参考',x:0,y:0,w:56,s:1.04,tilt:-2,score:86,pose:['先对齐人物头顶','再对齐肩膀和脚边','最后微调背景线条'],hints:['对齐头顶','参考肩线','背景扶正']}
};
const state={mode:'couple',camera:false,stream:null,facing:'environment',voice:true,auto:false,grid:true,saveGuide:false,counting:0,shot:false,lastHint:'',reference:null,referenceOpacity:48,detectEnabled:true,visionStatus:'未加载',face:null,pose:null,detectedAt:0};
const $=id=>document.getElementById(id);
const camera=$('camera'),video=$('video'),target=$('target'),people=$('people'),tips=$('tips'),modesEl=$('modes'),toast=$('toast'),overlay=$('overlay'),reference=$('reference'),referenceTools=$('referenceTools'),refInput=$('refInput'),refOpacity=$('refOpacity');
let overlayCtx=null;
let faceLandmarker=null;
let poseLandmarker=null;
let visionPromise=null;
let detectTimer=null;
function resizeOverlay(){const w=camera.clientWidth,h=camera.clientHeight;if(!w||!h)return;overlay.width=Math.round(w*devicePixelRatio);overlay.height=Math.round(h*devicePixelRatio);overlay.style.width='100%';overlay.style.height='100%';overlayCtx=overlay.getContext('2d')}
function getVideoRect(){const vw=video.videoWidth||720,vh=video.videoHeight||1280;const cw=camera.clientWidth,ch=camera.clientHeight;const videoRatio=vw/vh,boxRatio=cw/ch;let drawW,drawH,offsetX=0,offsetY=0;if(videoRatio>boxRatio){drawH=ch;drawW=drawH*videoRatio;offsetX=(cw-drawW)/2}else{drawW=cw;drawH=drawW/videoRatio;offsetY=(ch-drawH)/2}return{vw,vh,cw,ch,drawW,drawH,offsetX,offsetY}}
function drawOverlay(){if(!overlayCtx)return;const r=getVideoRect();overlayCtx.clearRect(0,0,overlay.width,overlay.height);if(!state.detectEnabled)return;const sx=overlay.width/r.cw,sy=overlay.height/r.ch;const face=state.face?.bbox;const pose=state.pose?.landmarks;if(face){overlayCtx.save();overlayCtx.strokeStyle='rgba(146,224,178,.95)';overlayCtx.lineWidth=3*devicePixelRatio;overlayCtx.strokeRect((r.offsetX+face.originX*r.drawW)*sx,(r.offsetY+face.originY*r.drawH)*sy,face.width*r.drawW*sx,face.height*r.drawH*sy);overlayCtx.restore()}if(pose?.length){const idx=[11,12,13,14,15,16,23,24,25,26,27,28].filter(i=>pose[i]);overlayCtx.save();overlayCtx.strokeStyle='rgba(255,211,138,.9)';overlayCtx.lineWidth=2*devicePixelRatio;overlayCtx.fillStyle='rgba(255,211,138,.95)';for(const i of idx){const p=pose[i];overlayCtx.beginPath();overlayCtx.arc((r.offsetX+p.x*r.drawW)*sx,(r.offsetY+p.y*r.drawH)*sy,4*devicePixelRatio,0,Math.PI*2);overlayCtx.fill()}const pairs=[[11,12],[11,13],[12,14],[13,15],[14,16],[23,24],[11,23],[12,24],[23,25],[24,26],[25,27],[26,28]];for(const [a,b] of pairs){if(pose[a]&&pose[b]){overlayCtx.beginPath();overlayCtx.moveTo((r.offsetX+pose[a].x*r.drawW)*sx,(r.offsetY+pose[a].y*r.drawH)*sy);overlayCtx.lineTo((r.offsetX+pose[b].x*r.drawW)*sx,(r.offsetY+pose[b].y*r.drawH)*sy);overlayCtx.stroke()}}overlayCtx.restore()}}
function toPoint(box){return{x:box.originX+box.width/2,y:box.originY+box.height/2}}
function clamp(n,min,max){return Math.max(min,Math.min(max,n))}
function loadVision(){if(visionPromise)return visionPromise;visionPromise=(async()=>{try{const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs');const {FaceLandmarker,PoseLandmarker,FilesetResolver}=vision;const resolver=await FilesetResolver.forVisionTasks(MEDIA_PIPE_WASM);faceLandmarker=await FaceLandmarker.createFromOptions(resolver,{baseOptions:{modelAssetPath:MEDIA_PIPE_FACE_MODEL},runningMode:'VIDEO',numFaces:2,minFaceDetectionConfidence:.55,minFacePresenceConfidence:.55,minTrackingConfidence:.55});poseLandmarker=await PoseLandmarker.createFromOptions(resolver,{baseOptions:{modelAssetPath:MEDIA_PIPE_POSE_MODEL},runningMode:'VIDEO',numPoses:2,minPoseDetectionConfidence:.5,minPosePresenceConfidence:.5,minTrackingConfidence:.5});state.visionStatus='识别已启用';showToast('AI 识别已加载');render();return true}catch(err){console.warn('vision init failed',err);state.visionStatus='演示模式';showToast('AI 识别加载失败，已用演示提示');render();return false}})();return visionPromise}
async function runDetection(){if(!state.camera||!state.detectEnabled||!faceLandmarker||!poseLandmarker||video.readyState<2)return;const now=performance.now();try{const faces=faceLandmarker.detectForVideo(video,now);const poses=poseLandmarker.detectForVideo(video,now);state.face=faces.faceLandmarks?.length?extractFaceBox(faces.faceLandmarks[0]):null;state.pose=poses.landmarks?.length?{landmarks:poses.landmarks[0],score:poses.landmarks?.length}:null;state.detectedAt=now;drawOverlay();const analysis=analyzeFrame();applyAnalysis(analysis)}catch(err){console.warn('detect failed',err);state.visionStatus='识别异常';drawOverlay()}}
function extractFaceBox(landmarks){let minX=1,minY=1,maxX=0,maxY=0;for(const p of landmarks){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)}const padX=(maxX-minX)*.22||.04,padY=(maxY-minY)*.3||.05;const x=clamp(minX-padX,0,.95),y=clamp(minY-padY,0,.95),width=clamp(maxX-minX+padX*2,.05,1-x),height=clamp(maxY-minY+padY*2,.05,1-y);return{bbox:{originX:x,originY:y,width,height}}}
function bodyBoxFromPose(landmarks){const points=[11,12,23,24,25,26,27,28].map(i=>landmarks[i]).filter(Boolean);if(!points.length)return null;let minX=1,minY=1,maxX=0,maxY=0;for(const p of points){minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y)}return{originX:clamp(minX-.06,0,.95),originY:clamp(minY-.06,0,.95),width:clamp(maxX-minX+.12,.06,1-minX),height:clamp(maxY-minY+.12,.08,1-minY)}}
function analyzeFrame(){const base=current(),result={score:base.score,hint:base.hint,detail:base.hint,stable:base.score>=88};if(!state.detectEnabled||(!state.face&&!state.pose)){return result}const r=getVideoRect();const face=state.face?.bbox;const pose=state.pose?.landmarks;const body=pose?bodyBoxFromPose(pose):null;const box=face||body;let score=base.score;if(box){const cx=toPoint(box).x-0.5,cy=toPoint(box).y-0.5;score-=Math.round(Math.abs(cx)*70+Math.abs(cy)*50);if(box.width<.16||box.height<.22){score-=4;result.hint='再靠近一点';result.detail='人物在画面里偏小';}else if(box.width>.44||box.height>.62){score-=5;result.hint='后退一步';result.detail='人物太满，留白不够';}else if(Math.abs(cx)>.09){result.hint=cx>0?'手机向右一点':'手机向左一点';result.detail='人物没有落在中轴附近';}else if(Math.abs(cy)>.08){result.hint=cy>0?'抬高一点':'压低一点';result.detail='人物中心偏离黄金区';}if(pose?.[11]&&pose?.[12]){const slope=pose[12].y-pose[11].y;score-=Math.round(Math.abs(slope)*30);if(Math.abs(slope)>.035){result.hint=slope>0?'右肩抬高一点':'左肩抬高一点';result.detail='肩线有点歪';}}if(pose?.[27]&&pose?.[28]&&Math.max(pose[27].y,pose[28].y)>.97){score-=4;result.hint='别切脚';result.detail='脚边快顶到底了';}if(pose?.[0]&&pose?.[1]){const eyeY=(pose[0].y+pose[1].y)/2;if(eyeY<.22){score-=2;result.detail='头顶留白偏多';}if(eyeY>.42){score-=3;result.hint='抬头一点';result.detail='眼睛位置偏低';}}}
score=clamp(Math.round(score),72,96);result.score=score;result.stable=score>=88;return result}
function applyAnalysis(a){$('hint').textContent=state.counting?`${state.counting}`:a.hint;$('detail').textContent=a.detail;$('score').textContent=a.score;$('quality').textContent=`构图 ${a.score} / 姿势 ${Math.max(80,a.score-3)} / ${state.visionStatus}`;$('shutter').classList.toggle('ready',a.stable);if(state.auto&&a.stable&&!state.counting&&!window.autoTimer){window.autoTimer=setTimeout(()=>{window.autoTimer=null;startCountdown()},1200)}}
function scheduleDetection(){clearInterval(detectTimer);detectTimer=setInterval(runDetection,160)}
function showToast(text){toast.textContent=text;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}
function speak(text){if(!state.voice||!('speechSynthesis'in window)||state.lastHint===text)return;state.lastHint=text;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=1.02;speechSynthesis.speak(u)}
function stopCamera(){state.stream?.getTracks().forEach(t=>t.stop());state.stream=null;video.srcObject=null;state.camera=false;camera.classList.remove('live');clearInterval(detectTimer);detectTimer=null;state.face=null;state.pose=null;drawOverlay()}
async function openCamera(facing=state.facing){if(!navigator.mediaDevices?.getUserMedia){showToast('浏览器不支持摄像头');return false}try{stopCamera();const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing,width:{ideal:1280},height:{ideal:1920}}});state.stream=stream;state.camera=true;state.facing=facing;video.srcObject=stream;video.classList.toggle('mirror',facing==='user');await video.play().catch(()=>{});camera.classList.add('live');resizeOverlay();await loadVision();scheduleDetection();showToast(facing==='user'?'已切到前置镜头':'摄像头已开启');render();return true}catch(e){showToast('请允许摄像头权限');render();return false}}
function current(){return modes[state.mode]}
function calc(){const m=current();const drift=Math.abs(m.x)*90+Math.abs(m.y)*70+Math.abs(m.tilt)*2+(m.w<53?4:0);const score=Math.max(72,Math.round(m.score-drift));const stable=score>=88;let hint=stable?'画面稳定，可以拍':'再微调一下';let detail=m.pose[0];if(Math.abs(m.tilt)>1.5){hint=m.tilt>0?'逆时针扶正':'顺时针扶正';detail='背景线条有点斜'}else if(m.w<53){hint='后退一步';detail='给腿和背景多留一点空间'}else if(Math.abs(m.x)>.025){hint=m.x>0?'手机向右一点':'手机向左一点';detail='人物稍微偏出黄金区域'}return{score,stable,hint,detail}}
function renderModes(){modesEl.innerHTML='';Object.entries(modes).forEach(([id,m])=>{const b=document.createElement('button');b.className=`mode${id===state.mode?' active':''}`;b.innerHTML=`<strong>${m.name}</strong><small>${m.sub}</small>`;b.onclick=()=>{state.mode=id;showToast(`切换到${m.name}`);render();};modesEl.appendChild(b)})}
function renderTips(){tips.innerHTML='';current().hints.forEach((t,i)=>{const b=document.createElement('button');b.className=i===0?'active':'';b.textContent=t;b.onclick=()=>{showToast(t);speak(t)};tips.appendChild(b)})}
function render(){const m=current(),a=state.detectEnabled&&state.camera&&(state.face||state.pose)?analyzeFrame():calc();target.style.setProperty('--x',`${50+m.x*100}%`);target.style.setProperty('--y',`${50+m.y*100}%`);target.style.setProperty('--w',`${m.w}%`);target.style.setProperty('--s',m.s);target.style.setProperty('--tilt',`${m.tilt}deg`);people.setAttribute('transform',`translate(${360+m.x*180} ${760+m.y*160}) scale(${m.s}) rotate(${m.tilt})`);$('hint').textContent=state.counting?`${state.counting}`:a.hint;$('detail').textContent=a.detail;$('score').textContent=a.score;$('quality').textContent=`构图 ${a.score} / 姿势 ${Math.max(80,a.score-3)} / ${state.visionStatus}`;$('camStatus').textContent=state.camera?'实时取景':'演示场景';$('shutter').classList.toggle('ready',a.stable);$('voiceBtn').textContent=state.voice?'语音开':'语音关';$('autoBtn').textContent=state.auto?'自动开':'自动拍';$('gridBtn').textContent=state.grid?'网格开':'网格关';$('detectBtn').textContent=state.detectEnabled?'AI识别':'演示提示';$('flipGuideBtn').textContent=state.saveGuide?'保存含框':'叠框保存';$('refBtn').classList.toggle('active',!!state.reference);$('flipGuideBtn').classList.toggle('active',state.saveGuide);$('thirds').style.display=state.grid?'block':'none';camera.style.setProperty('--ref-opacity',`${state.referenceOpacity/100}`);camera.classList.toggle('has-reference',!!state.reference);referenceTools.classList.toggle('show',state.mode==='sample'||!!state.reference);renderModes();renderTips();if(state.auto&&a.stable&&!state.counting&&!window.autoTimer){window.autoTimer=setTimeout(()=>{window.autoTimer=null;startCountdown()},1200)}drawOverlay()}
function flash(){const div=document.createElement('div');div.className='flash';camera.appendChild(div);setTimeout(()=>div.remove(),260)}
function drawDemoScene(ctx,w,h){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#e9d5c0');g.addColorStop(.58,'#cad9dc');g.addColorStop(1,'#607680');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.fillStyle='rgba(255,255,255,.28)';ctx.beginPath();ctx.arc(w*.78,h*.15,w*.16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5f7b7f';ctx.beginPath();ctx.moveTo(0,h*.64);ctx.bezierCurveTo(w*.2,h*.57,w*.38,h*.58,w*.54,h*.64);ctx.bezierCurveTo(w*.7,h*.7,w*.86,h*.7,w,h*.63);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();ctx.fill();const m=current();const cx=w*(.5+m.x*.25),cy=h*(.58+m.y*.12),scale=Math.min(w,h)/720;ctx.save();ctx.translate(cx,cy);ctx.rotate(m.tilt*Math.PI/180);ctx.scale(scale*m.s,scale*m.s);for(const side of[-1,1]){ctx.save();ctx.translate(side*86,0);ctx.fillStyle='rgba(0,0,0,.16)';ctx.beginPath();ctx.ellipse(0,172,55,11,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=side<0?'#8f6658':'#6f5963';ctx.beginPath();ctx.arc(0,0,32,0,Math.PI*2);ctx.fill();ctx.fillStyle=side<0?'#23384f':'#465e6e';ctx.beginPath();ctx.moveTo(-30,24);ctx.bezierCurveTo(-44,74,-26,126,-16,172);ctx.lineTo(18,172);ctx.bezierCurveTo(30,126,44,74,30,24);ctx.closePath();ctx.fill();ctx.strokeStyle='#fff1df';ctx.lineWidth=12;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-52,64);ctx.bezierCurveTo(-62,98,-38,124,-18,116);ctx.stroke();ctx.beginPath();ctx.moveTo(52,64);ctx.bezierCurveTo(62,98,38,124,18,116);ctx.stroke();ctx.strokeStyle=side<0?'#23384f':'#465e6e';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(-18,172);ctx.lineTo(-32,234);ctx.moveTo(18,172);ctx.lineTo(32,234);ctx.stroke();ctx.restore()}ctx.restore()}
function captureFrame(includeGuide=false){const r=getVideoRect();const canvas=document.createElement('canvas');const scale=2;canvas.width=Math.round(r.cw*scale);canvas.height=Math.round(r.ch*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,canvas.width,canvas.height);if(state.camera&&video.videoWidth){const src=state.facing==='user';ctx.save();if(src){ctx.translate(canvas.width,0);ctx.scale(-1,1)}ctx.drawImage(video,0,0,video.videoWidth,video.videoHeight,r.offsetX*scale,r.offsetY*scale,r.drawW*scale,r.drawH*scale);ctx.restore()}else{drawDemoScene(ctx,canvas.width,canvas.height)}if(state.reference?.loaded){ctx.save();ctx.globalAlpha=state.referenceOpacity/100;ctx.drawImage(state.reference.image,r.offsetX*scale,r.offsetY*scale,r.drawW*scale,r.drawH*scale);ctx.restore()}if(includeGuide){ctx.save();ctx.strokeStyle='rgba(255,255,255,.66)';ctx.lineWidth=2*scale;ctx.strokeRect((r.offsetX+20)*scale,(r.offsetY+20)*scale,(r.drawW-40)*scale,(r.drawH-40)*scale);ctx.restore()}return canvas}
function downloadCanvas(canvas){canvas.toBlob(blob=>{if(!blob){showToast('保存失败');return}if(window.lastPhotoUrl)URL.revokeObjectURL(window.lastPhotoUrl);const url=URL.createObjectURL(blob);const name=`boyfriend-camera-${new Date().toISOString().replace(/[:.]/g,'-')}.jpg`;$('savePreview').src=url;$('downloadLink').href=url;$('downloadLink').download=name;$('saveSheet').classList.add('open');window.lastPhotoUrl=url;const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();showToast('照片已生成，长按可存相册');speak('照片已生成')},'image/jpeg',.92)}
function shoot(){flash();const canvas=captureFrame(state.saveGuide);downloadCanvas(canvas)}
function tick(){if(!state.counting)return;if(state.counting===1){state.counting=0;shoot();render();return}state.counting-=1;speak(String(state.counting));render();setTimeout(tick,1000)}
function startCountdown(){if(state.counting)return;state.counting=3;speak('开始倒计时');render();setTimeout(tick,1000)}
$('cameraBtn').onclick=()=>state.camera?stopCamera()||render():openCamera(state.facing);
$('switchBtn').onclick=()=>openCamera(state.facing==='environment'?'user':'environment');
$('shutter').onclick=()=>state.camera?startCountdown():openCamera(state.facing);
$('saveBtn').onclick=()=>shoot();
$('voiceBtn').onclick=()=>{state.voice=!state.voice;if(!state.voice&&'speechSynthesis'in window)speechSynthesis.cancel();showToast(state.voice?'语音提示已开':'语音提示已关');render()};
$('autoBtn').onclick=()=>{state.auto=!state.auto;showToast(state.auto?'稳定后自动拍':'自动拍已关');render()};
$('detectBtn').onclick=()=>{state.detectEnabled=!state.detectEnabled;if(state.detectEnabled&&!state.camera)loadVision();showToast(state.detectEnabled?'已开启 AI 识别':'切到演示提示');render()};
$('gridBtn').onclick=()=>{state.grid=!state.grid;render()};
$('poseBtn').onclick=()=>{const m=current();$('poseTitle').textContent=`${m.name}姿势`;$('poseList').innerHTML=m.pose.map(x=>`<li>${x}</li>`).join('');$('poseSheet').classList.add('open')};
$('closeSheet').onclick=()=>$('poseSheet').classList.remove('open');
$('closeSaveSheet').onclick=()=>$('saveSheet').classList.remove('open');
$('refBtn').onclick=()=>{refInput.click()};
refInput.onchange=e=>{const file=e.target.files?.[0];if(!file)return;const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{state.reference={image:img,loaded:true,url};reference.src=url;showToast('参考图已加载');render()};img.src=url};
$('refOpacity').oninput=e=>{state.referenceOpacity=Number(e.target.value);render()};
$('clearRefBtn').onclick=()=>{if(state.reference?.url)URL.revokeObjectURL(state.reference.url);state.reference=null;reference.removeAttribute('src');showToast('参考图已清除');render()};
$('flipGuideBtn').onclick=()=>{state.saveGuide=!state.saveGuide;showToast(state.saveGuide?'保存时包含辅助线':'保存时不含辅助线');render()};
window.addEventListener('resize',()=>{resizeOverlay();drawOverlay()});
video.addEventListener('loadedmetadata',()=>{resizeOverlay();drawOverlay();if(state.camera)scheduleDetection()});
video.addEventListener('play',()=>{resizeOverlay();drawOverlay();if(state.camera)scheduleDetection()});
window.addEventListener('beforeunload',()=>{stopCamera();if('speechSynthesis'in window)speechSynthesis.cancel()});
resizeOverlay();
render();
</script>
</body>
</html>
